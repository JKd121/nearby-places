<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Nearby Explore — approved visual reference</title>
  <desc id="desc">A restrained map-first discovery workspace. A compact top search and category toolbar sits above a vertical nearby places list and a large map. The map shows only the confirmed center marker and search-radius circle, with no nearby result pins.</desc>
