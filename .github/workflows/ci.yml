name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, "Nearby-双身份内测Preview-20261107"]

permissions:
  contents: read

jobs:
  verify:
    name: Tests, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nearby_admission_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d nearby_admission_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/nearby_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/nearby_ci
      NEARBY_IDENTITY_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/nearby_identity_test_ci
      NEARBY_ADMISSION_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/nearby_admission_test_ci

    steps:
      - name: Download code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify PostgreSQL admission functions
        run: npm run test:admission:postgres

      - name: Create disposable identity database
        env:
          PGPASSWORD: ci
        run: psql -h 127.0.0.1 -U ci -d nearby_admission_test_ci -c 'CREATE DATABASE nearby_identity_test_ci'

      - name: Verify identity and BYOK with PostgreSQL and SMTP
        run: npm run test:identity:postgres

      - name: Verify private beta access and account management
        run: npm run test:beta:postgres

      - name: Verify login security assertions and fault handling
        run: npm run test:login-security:postgres

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser flows
        run: npm run test:e2e

      - name: Verify private beta browser flows
        run: npm run test:e2e:beta

      - name: Verify local beta login and guest entry
        env:
          NEARBY_BETA_E2E_ACCESS_MODE: local-beta
        run: npm run test:e2e:beta

      - name: Lint application
        run: npm run lint

      - name: Check types
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Verify map interaction and density on production build
        env:
          NEARBY_MAP_TEST_PRODUCTION: "1"
        run: npm run test:map:browser
